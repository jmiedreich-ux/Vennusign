name: deploy-dev

# Deploys master to the single-version dev environment. Does not re-run tests:
# a merge to master already passed phase02-tests.yml/ui-regression.yml as
# required PR checks, so this workflow only builds and deploys.
#
# Only master triggers a deploy. release/* and hotfix/* branches, version
# folders, and the AI release classifier are future work — see
# docs/design/progressive-customer-cutover-concept.md.
#
# Each deploy job targets the "dev" GitHub Environment, which requires a
# reviewer to approve before the job runs. The build/classify steps still
# run automatically on every push; only the actual Azure deploy pauses for
# approval, so merges can land on master without immediately going live.

on:
  push:
    branches: [master]

concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      dotnet_api: ${{ steps.classify.outputs.dotnet_api }}
      platform_operations: ${{ steps.classify.outputs.platform_operations }}
      back_office: ${{ steps.classify.outputs.back_office }}
      display: ${{ steps.classify.outputs.display }}
      www: ${{ steps.classify.outputs.www }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Collect changed paths since previous commit
        run: git diff --name-only HEAD^ HEAD > changed-paths.txt || git ls-files > changed-paths.txt
      - name: Classify changed apps
        id: classify
        run: bash scripts/ci/classify-changes.sh changed-paths.txt

  # One approval for the whole deployment, not one per application. Environment
  # protection gates every job that names the environment, so with `environment: dev`
  # on all five deploy jobs a sequential chain asked five separate times, arriving
  # minutes apart. This job is the only thing that names it; everything else waits
  # on this. The Azure credentials are repository secrets, so the deploy jobs do not
  # need the environment to read them.
  gate:
    if: >-
      needs.classify.outputs.dotnet_api == 'true' ||
      needs.classify.outputs.back_office == 'true' ||
      needs.classify.outputs.display == 'true' ||
      needs.classify.outputs.www == 'true' ||
      needs.classify.outputs.platform_operations == 'true'
    needs: classify
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - run: echo "Deployment approved for dev."

  deploy-api:
    if: needs.classify.outputs.dotnet_api == 'true'
    needs: [classify, gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Publish
        run: dotnet publish src/Vennu.Api/Vennu.Api.csproj -c Release -o publish/api
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/webapps-deploy@v3
        with:
          app-name: vennusign-dev-api
          package: publish/api

  deploy-back-office:
    if: ${{ !failure() && !cancelled() && needs.classify.outputs.back_office == 'true' }}
    needs: [classify, gate, deploy-api]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and build
        working-directory: src/back-office
        run: |
          # Build configuration lives beside the app, not here, so editing
          # this workflow no longer implies rebuilding every application.
          set -a && . ./env/dev.env && set +a
          # Vite bakes these in at build time and silently substitutes an empty
          # string for anything unset, which ships a bundle that calls "/api/..."
          # on its own origin and fails for every visitor. Fail the deploy here
          # instead, where the cause is obvious.
          for required in $(grep -oE '^VITE_[A-Z_]+' ./env/dev.env); do
            if [ -z "$(eval echo \$$required)" ]; then
              echo "::error::$required is empty after sourcing env/dev.env - refusing to build a misconfigured bundle"
              exit 1
            fi
          done
          npm ci
          npm run build
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/webapps-deploy@v3
        with:
          app-name: vennusign-dev-back-office
          package: src/back-office/dist

  deploy-display:
    if: ${{ !failure() && !cancelled() && needs.classify.outputs.display == 'true' }}
    needs: [classify, gate, deploy-back-office]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and build
        working-directory: src/display
        run: |
          # Build configuration lives beside the app, not here, so editing
          # this workflow no longer implies rebuilding every application.
          set -a && . ./env/dev.env && set +a
          # Vite bakes these in at build time and silently substitutes an empty
          # string for anything unset, which ships a bundle that calls "/api/..."
          # on its own origin and fails for every visitor. Fail the deploy here
          # instead, where the cause is obvious.
          for required in $(grep -oE '^VITE_[A-Z_]+' ./env/dev.env); do
            if [ -z "$(eval echo \$$required)" ]; then
              echo "::error::$required is empty after sourcing env/dev.env - refusing to build a misconfigured bundle"
              exit 1
            fi
          done
          npm ci
          npm run build
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/webapps-deploy@v3
        with:
          app-name: vennusign-dev-display
          package: src/display/dist

  deploy-www:
    if: ${{ !failure() && !cancelled() && needs.classify.outputs.www == 'true' }}
    needs: [classify, gate, deploy-display]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and build
        working-directory: src/www
        run: |
          # Build configuration lives beside the app, not here, so editing
          # this workflow no longer implies rebuilding every application.
          set -a && . ./env/dev.env && set +a
          # Vite bakes these in at build time and silently substitutes an empty
          # string for anything unset, which ships a bundle that calls "/api/..."
          # on its own origin and fails for every visitor. Fail the deploy here
          # instead, where the cause is obvious.
          for required in $(grep -oE '^VITE_[A-Z_]+' ./env/dev.env); do
            if [ -z "$(eval echo \$$required)" ]; then
              echo "::error::$required is empty after sourcing env/dev.env - refusing to build a misconfigured bundle"
              exit 1
            fi
          done
          npm ci
          npm run build
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/webapps-deploy@v3
        with:
          app-name: vennusign-dev
          package: src/www/dist

  deploy-po:
    if: ${{ !failure() && !cancelled() && needs.classify.outputs.platform_operations == 'true' }}
    needs: [classify, gate, deploy-www]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and build
        working-directory: src/platform-operations
        run: |
          # Build configuration lives beside the app, not here, so editing
          # this workflow no longer implies rebuilding every application.
          set -a && . ./env/dev.env && set +a
          # Vite bakes these in at build time and silently substitutes an empty
          # string for anything unset, which ships a bundle that calls "/api/..."
          # on its own origin and fails for every visitor. Fail the deploy here
          # instead, where the cause is obvious.
          for required in $(grep -oE '^VITE_[A-Z_]+' ./env/dev.env); do
            if [ -z "$(eval echo \$$required)" ]; then
              echo "::error::$required is empty after sourcing env/dev.env - refusing to build a misconfigured bundle"
              exit 1
            fi
          done
          npm ci
          npm run build
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/webapps-deploy@v3
        with:
          app-name: vennusign-dev-po
          package: src/platform-operations/dist
