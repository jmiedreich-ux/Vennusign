name: deploy-dev

# Deploys master to the single-version dev environment. Does not re-run tests:
# a merge to master already passed phase02-tests.yml/ui-regression.yml as
# required PR checks, so this workflow only builds and deploys.
#
# Only master triggers a deploy. release/* and hotfix/* branches, version
# folders, and the AI release classifier are future work — see
# docs/design/progressive-customer-cutover-concept.md.
#
# Each deploy job targets the "dev" GitHub Environment, which requires a
# reviewer to approve before the job runs. The build/classify steps still
# run automatically on every push; only the actual Azure deploy pauses for
# approval, so merges can land on master without immediately going live.

on:
  push:
    branches: [master]

concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  # Every dev application lives in this one resource group. The post-deploy
  # verification steps need it to restart an app that did not pick up its
  # new build; the deploy action itself resolves the app by name alone.
  AZURE_RESOURCE_GROUP: rg-basic-website

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      dotnet_api: ${{ steps.classify.outputs.dotnet_api }}
      platform_operations: ${{ steps.classify.outputs.platform_operations }}
      back_office: ${{ steps.classify.outputs.back_office }}
      display: ${{ steps.classify.outputs.display }}
      www: ${{ steps.classify.outputs.www }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Collect changed paths for every commit in this push
        run: |
          # A push carries as many commits as were merged, not one. Diffing
          # HEAD^..HEAD classified only the last of them and silently ignored
          # the rest, so a push whose final commit happened to be documentation
          # deployed nothing at all - even though an earlier commit in the same
          # push changed an application. Observed on c4f40200: three commits,
          # the last one a report, every deploy job skipped, and the run went
          # green having shipped nothing.
          #
          # github.event.before is the tip this push moved master from, so the
          # range covers exactly what arrived. It is absent on the first push of
          # a branch and can point at a commit force-pushed away, so both cases
          # fall back to classifying everything rather than classifying too little.
          before='${{ github.event.before }}'
          if [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "$before^{commit}" 2>/dev/null; then
            git diff --name-only "$before" '${{ github.sha }}' > changed-paths.txt
          else
            echo "No usable previous tip; classifying the whole tree."
            git ls-files > changed-paths.txt
          fi
          cat changed-paths.txt
      - name: Classify changed apps
        id: classify
        run: bash scripts/ci/classify-changes.sh changed-paths.txt

  # One approval for the whole deployment, not one per application. Environment
  # protection gates every job that names the environment, so with `environment: dev`
  # on all five deploy jobs a sequential chain asked five separate times, arriving
  # minutes apart. This job is the only thing that names it; everything else waits
  # on this. The Azure credentials are repository secrets, so the deploy jobs do not
  # need the environment to read them.
  gate:
    if: >-
      needs.classify.outputs.dotnet_api == 'true' ||
      needs.classify.outputs.back_office == 'true' ||
      needs.classify.outputs.display == 'true' ||
      needs.classify.outputs.www == 'true' ||
      needs.classify.outputs.platform_operations == 'true'
    needs: classify
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - run: echo "Deployment approved for dev."

  deploy-api:
    if: needs.classify.outputs.dotnet_api == 'true'
    needs: [classify, gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Publish
        run: dotnet publish src/Vennu.Api/Vennu.Api.csproj -c Release -o publish/api
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/webapps-deploy@v3
        with:
          app-name: vennusign-dev-api
          package: publish/api
      # Two things at once, and the order is load-bearing.
      #
      # Writing these settings is what tells the running API which commit it is,
      # so /health/version stops reporting "local" and a deploy becomes provable
      # from outside (#726). Writing them is ALSO what forces the recycle: an app
      # settings change restarts the app, where OneDeploy only requests a recycle
      # and, under load, does not get one (#740).
      #
      # They cannot be written before the package is uploaded. That would restart
      # the OLD build carrying the NEW commit id, and the check below would go
      # green while the previous code was still serving - the exact lie this is
      # here to catch.
      - name: Stamp the running build with the commit it came from
        run: |
          az webapp config appsettings set \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name vennusign-dev-api \
            --settings VENNU_SOURCE_COMMIT=${{ github.sha }} VENNU_BUILD_ID=${{ github.run_id }} \
            --output none
      - name: Confirm dev.api.vennusign.com is serving this commit
        run: |
          bash scripts/ci/confirm-deployment.sh \
            "$AZURE_RESOURCE_GROUP" vennusign-dev-api \
            https://dev.api.vennusign.com/health/version ${{ github.sha }}

  deploy-back-office:
    if: ${{ !failure() && !cancelled() && needs.classify.outputs.back_office == 'true' }}
    needs: [classify, gate, deploy-api]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and build
        working-directory: src/back-office
        run: |
          # Build configuration lives beside the app, not here, so editing
          # this workflow no longer implies rebuilding every application.
          set -a && . ./env/dev.env && set +a
          # Vite bakes these in at build time and silently substitutes an empty
          # string for anything unset, which ships a bundle that calls "/api/..."
          # on its own origin and fails for every visitor. Fail the deploy here
          # instead, where the cause is obvious.
          for required in $(grep -oE '^VITE_[A-Z_]+' ./env/dev.env); do
            if [ -z "$(eval echo \$$required)" ]; then
              echo "::error::$required is empty after sourcing env/dev.env - refusing to build a misconfigured bundle"
              exit 1
            fi
          done
          npm ci
          npm run build
          # A static build carries no identity of its own, so nothing outside the
          # deploy job can tell a new bundle from the previous one still being
          # served (#726). This writes dist/version.json for the check that
          # follows the deploy (#740).
          bash ../../scripts/ci/stamp-build-version.sh ./dist
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/webapps-deploy@v3
        with:
          app-name: vennusign-dev-back-office
          package: src/back-office/dist
      - name: Confirm dev.back-office.vennusign.com is serving this commit
        run: |
          bash scripts/ci/confirm-deployment.sh \
            "$AZURE_RESOURCE_GROUP" vennusign-dev-back-office \
            https://dev.back-office.vennusign.com/version.json ${{ github.sha }}

  deploy-display:
    if: ${{ !failure() && !cancelled() && needs.classify.outputs.display == 'true' }}
    needs: [classify, gate, deploy-back-office]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and build
        working-directory: src/display
        run: |
          # Build configuration lives beside the app, not here, so editing
          # this workflow no longer implies rebuilding every application.
          set -a && . ./env/dev.env && set +a
          # Vite bakes these in at build time and silently substitutes an empty
          # string for anything unset, which ships a bundle that calls "/api/..."
          # on its own origin and fails for every visitor. Fail the deploy here
          # instead, where the cause is obvious.
          for required in $(grep -oE '^VITE_[A-Z_]+' ./env/dev.env); do
            if [ -z "$(eval echo \$$required)" ]; then
              echo "::error::$required is empty after sourcing env/dev.env - refusing to build a misconfigured bundle"
              exit 1
            fi
          done
          npm ci
          npm run build
          # A static build carries no identity of its own, so nothing outside the
          # deploy job can tell a new bundle from the previous one still being
          # served (#726). This writes dist/version.json for the check that
          # follows the deploy (#740).
          bash ../../scripts/ci/stamp-build-version.sh ./dist
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/webapps-deploy@v3
        with:
          app-name: vennusign-dev-display
          package: src/display/dist
      - name: Confirm dev.display.vennusign.com is serving this commit
        run: |
          bash scripts/ci/confirm-deployment.sh \
            "$AZURE_RESOURCE_GROUP" vennusign-dev-display \
            https://dev.display.vennusign.com/version.json ${{ github.sha }}

  deploy-www:
    if: ${{ !failure() && !cancelled() && needs.classify.outputs.www == 'true' }}
    needs: [classify, gate, deploy-display]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and build
        working-directory: src/www
        run: |
          # Build configuration lives beside the app, not here, so editing
          # this workflow no longer implies rebuilding every application.
          set -a && . ./env/dev.env && set +a
          # Vite bakes these in at build time and silently substitutes an empty
          # string for anything unset, which ships a bundle that calls "/api/..."
          # on its own origin and fails for every visitor. Fail the deploy here
          # instead, where the cause is obvious.
          for required in $(grep -oE '^VITE_[A-Z_]+' ./env/dev.env); do
            if [ -z "$(eval echo \$$required)" ]; then
              echo "::error::$required is empty after sourcing env/dev.env - refusing to build a misconfigured bundle"
              exit 1
            fi
          done
          npm ci
          npm run build
          # A static build carries no identity of its own, so nothing outside the
          # deploy job can tell a new bundle from the previous one still being
          # served (#726). This writes dist/version.json for the check that
          # follows the deploy (#740).
          bash ../../scripts/ci/stamp-build-version.sh ./dist
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/webapps-deploy@v3
        with:
          app-name: vennusign-dev
          package: src/www/dist
      - name: Confirm dev.vennusign.com is serving this commit
        run: |
          bash scripts/ci/confirm-deployment.sh \
            "$AZURE_RESOURCE_GROUP" vennusign-dev \
            https://dev.vennusign.com/version.json ${{ github.sha }}

  deploy-po:
    if: ${{ !failure() && !cancelled() && needs.classify.outputs.platform_operations == 'true' }}
    needs: [classify, gate, deploy-www]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and build
        working-directory: src/platform-operations
        run: |
          # Build configuration lives beside the app, not here, so editing
          # this workflow no longer implies rebuilding every application.
          set -a && . ./env/dev.env && set +a
          # Vite bakes these in at build time and silently substitutes an empty
          # string for anything unset, which ships a bundle that calls "/api/..."
          # on its own origin and fails for every visitor. Fail the deploy here
          # instead, where the cause is obvious.
          for required in $(grep -oE '^VITE_[A-Z_]+' ./env/dev.env); do
            if [ -z "$(eval echo \$$required)" ]; then
              echo "::error::$required is empty after sourcing env/dev.env - refusing to build a misconfigured bundle"
              exit 1
            fi
          done
          npm ci
          npm run build
          # A static build carries no identity of its own, so nothing outside the
          # deploy job can tell a new bundle from the previous one still being
          # served (#726). This writes dist/version.json for the check that
          # follows the deploy (#740).
          bash ../../scripts/ci/stamp-build-version.sh ./dist
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/webapps-deploy@v3
        with:
          app-name: vennusign-dev-po
          package: src/platform-operations/dist
      - name: Confirm dev.po.vennusign.com is serving this commit
        run: |
          bash scripts/ci/confirm-deployment.sh \
            "$AZURE_RESOURCE_GROUP" vennusign-dev-po \
            https://dev.po.vennusign.com/version.json ${{ github.sha }}
