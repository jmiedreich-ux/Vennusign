name: Atlas

# Decision 30: the site rebuilds on every push to the default branch and on a six-hourly
# schedule, so it reflects both the records (which change on merge) and the open issues
# (which change without any commit here at all).
on:
  # Only the records change what this site says, so only they are worth a rebuild. A commit that
  # touches no record leaves the site correct, and the six-hourly run below still catches issues,
  # which change without any commit here at all.
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'ROADMAP.md'
      - 'atlas.config.json'
      - '.atlas/**'
      - '.github/workflows/atlas.yml'
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

# Least privilege. `contents` reads the records; `issues` reads each workstream's backlog.
# Without `issues` the fetch 403s and Atlas degrades to empty buckets — the site would then
# claim every workstream has no open work, which is worse than saying nothing.
permissions:
  contents: read
  issues: read

concurrency:
  group: atlas-site
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Vennusign
        uses: actions/checkout@v4

      # Atlas is a separate repository consumed as a versioned Action (decisions 39, 46).
      # The version tags live in the Atlas repository; nothing here is tagged for it.
      - name: Build the site
        id: atlas
        uses: jmiedreich-ux/Atlas@v1
        with:
          project-path: ${{ github.workspace }}
          output-dir: .atlas-out
          github-token: ${{ github.token }}

      # Atlas decision 7: nothing on this site is anonymous. Since Atlas v1.1.0 the generator
      # emits a staticwebapp.config.json of its own, so a project that configures nothing gets a
      # gated site rather than a public one. This step overwrites it, and must stay: the generator's
      # default signs in with Microsoft per decision 7, while this deployment uses GitHub — the one
      # identity that could be verified for the owner when the site was gated. Delete this step and
      # sign-in silently redirects to a provider this app is not configured for.
      - name: Gate every route behind an invited role
        shell: bash
        run: |
          test -f .atlas/staticwebapp.config.json
          test -f .atlas-out/staticwebapp.config.json
          # Atlas emits a config carrying the /api/* rule and the Functions runtime; this project
          # overrides only the login provider, because this app signs in with GitHub while the
          # generator's default is Microsoft. Merging keeps both rather than discarding one.
          node -e '
            const fs = require("fs");
            const emitted = JSON.parse(fs.readFileSync(".atlas-out/staticwebapp.config.json", "utf8"));
            const ours = JSON.parse(fs.readFileSync(".atlas/staticwebapp.config.json", "utf8"));
            const api = (emitted.routes || []).filter(r => r.route.startsWith("/api"));
            const rest = (ours.routes || []);
            const merged = {
              ...emitted, ...ours,
              routes: [...rest.filter(r => r.route.startsWith("/.auth")),
                       ...api,
                       ...rest.filter(r => !r.route.startsWith("/.auth"))],
            };
            if (emitted.platform) merged.platform = emitted.platform;
            fs.writeFileSync(".atlas-out/staticwebapp.config.json", JSON.stringify(merged, null, 2) + "\n");
          '
          echo "--- gate copied into the artifact ---"
          cat .atlas-out/staticwebapp.config.json

      - name: Publish to atlas.vennusign.com
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.ATLAS_SWA_DEPLOYMENT_TOKEN }}
          action: upload
          app_location: .atlas-out
          api_location: ${{ steps.atlas.outputs.api-path }}
          skip_app_build: true
          skip_api_build: true
