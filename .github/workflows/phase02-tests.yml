name: phase02-tests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    environment: dev
    env:
      VENU_TEST_AZURE_SQL_CONNECTION_STRING: ${{ secrets.VENU_TEST_AZURE_SQL_CONNECTION_STRING }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore /home/runner/work/Vennusign/Vennusign/Vennusign.sln

      - name: Build
        run: dotnet build /home/runner/work/Vennusign/Vennusign/Vennusign.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test /home/runner/work/Vennusign/Vennusign/Vennusign.sln --configuration Release --no-build
