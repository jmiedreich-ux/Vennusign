name: phase02-tests

on:
  workflow_dispatch:
    inputs:
      full_validation:
        description: Run the complete non-integration suite
        required: false
        default: true
        type: boolean
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
    paths-ignore:
      - "docs/**"
  schedule:
    - cron: "0 7 * * *"

concurrency:
  group: phase02-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      full: ${{ steps.classify.outputs.full }}
      dotnet_api: ${{ steps.classify.outputs.dotnet_api }}
      dotnet_data_access: ${{ steps.classify.outputs.dotnet_data_access }}
      platform_operations: ${{ steps.classify.outputs.platform_operations }}
      back_office: ${{ steps.classify.outputs.back_office }}
      display: ${{ steps.classify.outputs.display }}
      android_tv: ${{ steps.classify.outputs.android_tv }}
      tizen: ${{ steps.classify.outputs.tizen }}
      webos: ${{ steps.classify.outputs.webos }}
      dev_control: ${{ steps.classify.outputs.dev_control }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Collect changed paths
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" > changed-paths.txt
          else
            git ls-files > changed-paths.txt
          fi
          cat changed-paths.txt
      - name: Classify validation scope
        id: classify
        env:
          CI_FULL_VALIDATION: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full_validation) || contains(toJson(github.event.pull_request.labels.*.name), 'full-validation') }}
        run: bash scripts/ci/classify-changes.sh changed-paths.txt

  docs-validation:
    needs: classify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate repository records and classifier
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
          else
            git diff --check HEAD^
          fi
          jq empty tracker/assignments.json
          bash scripts/ci/test-classify-changes.sh
          if git grep -n -E '^(<<<<<<<|=======|>>>>>>>)'; then
            echo "Unresolved merge marker found."
            exit 1
          fi
      - name: Integration Tests Skipped
        run: echo "Integration, live-provider, credentialed, hosted-infrastructure, container, and cross-system tests are intentionally skipped."

  dotnet-api:
    if: needs.classify.outputs.dotnet_api == 'true'
    needs: classify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Restore affected test project
        run: dotnet restore tests/Vennu.Api.Tests/Vennu.Api.Tests.csproj
      - name: Build and run affected API unit tests
        run: dotnet test tests/Vennu.Api.Tests/Vennu.Api.Tests.csproj --configuration Release --no-restore --filter "Category=Unit" --logger "console;verbosity=normal"

  dotnet-data-access:
    if: needs.classify.outputs.dotnet_data_access == 'true'
    needs: classify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Restore affected test project
        run: dotnet restore tests/Vennu.DataAccess.Tests/Vennu.DataAccess.Tests.csproj
      - name: Build and run affected data-access unit tests
        run: dotnet test tests/Vennu.DataAccess.Tests/Vennu.DataAccess.Tests.csproj --configuration Release --no-restore --filter "Category=Unit" --logger "console;verbosity=normal"

  sql-integration:
    # The suite that proves the product against a real database. It ran only on a
    # developer's machine until now, which meant the layer the reviews kept finding
    # defects in was the one layer CI never checked. windows-latest ships LocalDB, so
    # the run is hermetic - no Azure, no shared state, nothing to configure.
    if: needs.classify.outputs.dotnet_api == 'true' || needs.classify.outputs.dotnet_data_access == 'true'
    needs: classify
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Start LocalDB
        shell: pwsh
        run: |
          # The runner ships LocalDB but leaves the instance stopped, so a bare
          # sqlcmd fails with "delay in opening server connection".
          & sqllocaldb start MSSQLLocalDB
          $connected = $false
          foreach ($attempt in 1..12) {
            & sqlcmd -S '(localdb)\MSSQLLocalDB' -E -b -Q "SELECT 1;" | Out-Null
            if ($LASTEXITCODE -eq 0) { $connected = $true; break }
            Start-Sleep -Seconds 5
          }
          if (-not $connected) { throw 'LocalDB did not accept connections.' }
      - name: Run the SQL-backed integration suite
        shell: pwsh
        # No connection string is set on purpose: the fixture defaults to LocalDB,
        # creates the database and migrates it from scratch. A run with no database
        # fails rather than reporting a pass, so a green result here means the SQL ran.
        run: dotnet test tests/Vennu.Data.IntegrationTests/Vennu.Data.IntegrationTests.csproj --configuration Release --logger "console;verbosity=normal"

  frontend:
    if: needs.classify.outputs.platform_operations == 'true' || needs.classify.outputs.back_office == 'true' || needs.classify.outputs.display == 'true'
    needs: classify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: platform-operations
            enabled: ${{ needs.classify.outputs.platform_operations }}
          - app: back-office
            enabled: ${{ needs.classify.outputs.back_office }}
          - app: display
            enabled: ${{ needs.classify.outputs.display }}
    steps:
      - name: Skip unaffected frontend
        if: matrix.enabled != 'true'
        run: echo "${{ matrix.app }} is unaffected."
      - uses: actions/checkout@v4
        if: matrix.enabled == 'true'
      - uses: actions/setup-node@v4
        if: matrix.enabled == 'true'
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: src/${{ matrix.app }}/package-lock.json
      - name: Install, build, and test affected frontend
        if: matrix.enabled == 'true'
        working-directory: src/${{ matrix.app }}
        run: |
          npm ci
          npm run build
          npm test

  android-tv:
    if: needs.classify.outputs.android_tv == 'true'
    needs: classify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build affected Android TV profiles
        working-directory: src/tv/android
        run: gradle :app:assembleGoogleTvDebug :app:assembleFireTvDebug --no-daemon --stacktrace

  tizen:
    if: needs.classify.outputs.tizen == 'true'
    needs: classify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - run: node src/tv/tizen/scripts/validate.mjs

  webos:
    if: needs.classify.outputs.webos == 'true'
    needs: classify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - run: node src/tv/webos/scripts/validate.mjs

  dev-control:
    if: needs.classify.outputs.dev_control == 'true'
    needs: classify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Build and test Vennu Development Control
        run: dotnet test tools/Vennu.DevControl.Tests/Vennu.DevControl.Tests.csproj --configuration Release --logger "console;verbosity=normal"
      - name: Validate local key helper syntax
        shell: pwsh
        run: |
          foreach ($script in @('scripts/set-platform-operations-key.ps1', 'scripts/start-track1-acceptance.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw "$script`n$($errors | Out-String)" }
          }

  build-and-test:
    if: always()
    needs: [classify, docs-validation, dotnet-api, dotnet-data-access, sql-integration, frontend, android-tv, tizen, webos, dev-control]
    runs-on: ubuntu-latest
    steps:
      - name: Require every applicable affected-area check
        env:
          RESULTS: ${{ toJson(needs) }}
        run: |
          if echo "$RESULTS" | jq -e 'to_entries | any(.value.result == "failure" or .value.result == "cancelled")' >/dev/null; then
            echo "$RESULTS"
            exit 1
          fi
          echo "All applicable affected-area checks passed; unrelated areas were skipped."
