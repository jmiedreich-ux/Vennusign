name: phase02-tests

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    environment: dev
    env:
      VENU_TEST_AZURE_SQL_CONNECTION_STRING: ${{ secrets.VENU_TEST_AZURE_SQL_CONNECTION_STRING }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        shell: bash
        run: |
          set +e
          dotnet restore ${{ github.workspace }}/Vennusign.sln > restore.log 2>&1
          status=$?
          if [ $status -ne 0 ]; then
            echo "=== Restore Errors ==="
            grep -E "(error|NU[0-9]{4}|MSB[0-9]{4})" restore.log || tail -n 80 restore.log
            echo "======================"
            exit $status
          fi
          cat restore.log

      - name: Upload restore diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: restore-log
          path: restore.log
          if-no-files-found: ignore

      - name: Build
        run: dotnet build ${{ github.workspace }}/Vennusign.sln --configuration Release --no-restore

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: src/display/package-lock.json

      - name: Install display dependencies
        working-directory: src/display
        run: npm ci

      - name: Build display
        working-directory: src/display
        shell: bash
        run: |
          set +e
          npm run build > display-build.log 2>&1
          status=$?
          if [ $status -ne 0 ]; then
            echo "=== Display Build Errors ==="
            tail -n 100 display-build.log
            echo "============================"
            exit $status
          fi
          cat display-build.log

      - name: Upload display build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: display-build-log
          path: src/display/display-build.log
          if-no-files-found: ignore

      - name: Diagnose environment
        run: |
          echo "=== Environment Diagnostics ==="
          echo ".NET SDK version: $(dotnet --version)"
          echo "Node version: $(node --version)"
          echo "npm version: $(npm --version)"
          echo "Runner OS: $RUNNER_OS"
          echo "Working directory: $(pwd)"
          if [ -n "$VENU_TEST_AZURE_SQL_CONNECTION_STRING" ]; then
            echo "Azure SQL connection string: CONFIGURED"
          else
            echo "Azure SQL connection string: NOT CONFIGURED (integration tests will be skipped)"
          fi
          echo "=============================="

      - name: Run unit tests
        run: |
          echo "=== Running Unit Tests ==="
          dotnet test ${{ github.workspace }}/Vennusign.sln \
            --configuration Release \
            --no-build \
            --filter "Category=Unit" \
            --logger "console;verbosity=normal" \
            --logger "trx;LogFileName=unit-test-results.trx" \
            -- RunConfiguration.TestSessionTimeout=120000
          echo "========================="

      - name: Skip integration tests notice
        run: |
          echo "=== Integration Tests Skipped ==="
          echo "Integration-type tests are intentionally skipped for every work package"
          echo "under the repository owner's standing validation instruction."
          echo "================================="

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: "**/unit-test-results.trx"
          if-no-files-found: ignore

      - name: Test summary
        if: always()
        run: |
          echo "=== Test Run Summary ==="
          echo "Display app: dependencies installed and production build executed"
          echo "Unit tests: ran with filter Category=Unit"
          echo "Integration tests: SKIPPED by standing repository-owner instruction"
          echo "Projects tested:"
          echo "  - src/display (npm ci and npm run build)"
          echo "  - Vennu.DataAccess.Tests (unit: repository and data access tests)"
          echo "  - Vennu.Api.Tests (unit: controller tests; integration: vertical slice)"
          echo "  - Vennu.Data.IntegrationTests (integration: entity persistence tests)"
          echo "========================"
