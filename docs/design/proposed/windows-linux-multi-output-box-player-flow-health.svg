<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
 <title id="title">Health is evidence, then a bounded recovery — not a heartbeat reflex</title><desc id="desc">The Runtime reports render evidence locally. The Supervisor decides whether the display is merely late, degraded, or actually lost.</desc>
 <defs><marker id="inkArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#334155"/></marker><marker id="orangeArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#b45309"/></marker><marker id="greenArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#087f5b"/></marker></defs>
 <rect width="1200" height="700" fill="#f5f7fa"/><text x="64" y="59" font-family="system-ui,Segoe UI,sans-serif" font-size="29" font-weight="700" letter-spacing="-.6" fill="#18212f">Health is evidence, then a bounded recovery — not a heartbeat reflex</text><text x="64" y="90" font-family="system-ui,Segoe UI,sans-serif" font-size="16" fill="#586575">The Runtime reports render evidence locally. The Supervisor decides whether the display is merely late, degraded, or actually lost.</text>
 <rect x="64" y="122" width="1072" height="488" rx="18" fill="#ffffff" stroke="#d4dbe5" stroke-width="1.5"/><text x="94" y="147" font-family="system-ui,Segoe UI,sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.2" fill="#64748b">REQUEST → RESPONSE SEQUENCE</text>
 <line x1="180" y1="216" x2="180" y2="596" stroke="#d5dce5" stroke-width="1" stroke-dasharray="4 6"/><line x1="600" y1="216" x2="600" y2="596" stroke="#d5dce5" stroke-width="1" stroke-dasharray="4 6"/><line x1="1020" y1="216" x2="1020" y2="596" stroke="#d5dce5" stroke-width="1" stroke-dasharray="4 6"/><rect x="88" y="162" width="184" height="54" rx="11" fill="#ffffff" stroke="#cbd5e1"/><text x="180" y="187" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="700" fill="#273449">Display Runtime</text><text x="180" y="204" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="10.5" fill="#687587">per output</text><rect x="508" y="162" width="184" height="54" rx="11" fill="#fff8ed" stroke="#cbd5e1"/><text x="600" y="187" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="700" fill="#273449">Player Supervisor</text><text x="600" y="204" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="10.5" fill="#687587">health state machine</text><rect x="928" y="162" width="184" height="54" rx="11" fill="#ffffff" stroke="#cbd5e1"/><text x="1020" y="187" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="700" fill="#273449">Vennusign Cloud</text><text x="1020" y="204" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="10.5" fill="#687587">latest status / events</text><path d="M180 258 H600" fill="none" stroke="#b45309" stroke-width="2.2" marker-end="url(#orangeArrow)"/><rect x="270" y="236" width="240" height="19" rx="5" fill="#f5f7fa"/><text x="390" y="250" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="11.5" fill="#b45309">① local: frame progress + applied revision</text><path d="M600 306 H1020" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#inkArrow)"/><rect x="690" y="284" width="240" height="19" rx="5" fill="#f5f7fa"/><text x="810" y="298" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="11.5" fill="#334155">② upsert latest PlayerOutputStatus</text><path d="M1020 354 H600" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="5 5" marker-end="url(#inkArrow)"/><rect x="690" y="332" width="240" height="19" rx="5" fill="#f5f7fa"/><text x="810" y="346" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="11.5" fill="#64748b">③ status accepted / action snapshot</text><path d="M180 402 H600" fill="none" stroke="#b45309" stroke-width="2.2" marker-end="url(#orangeArrow)"/><rect x="270" y="380" width="240" height="19" rx="5" fill="#f5f7fa"/><text x="390" y="394" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="11.5" fill="#b45309">④ fault or no render evidence</text><path d="M600 450 H180" fill="none" stroke="#b45309" stroke-width="2.2" marker-end="url(#orangeArrow)"/><rect x="270" y="428" width="240" height="19" rx="5" fill="#f5f7fa"/><text x="390" y="442" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="11.5" fill="#b45309">⑤ warm replacement from verified local content</text><path d="M180 498 H600" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="5 5" marker-end="url(#inkArrow)"/><rect x="270" y="476" width="240" height="19" rx="5" fill="#f5f7fa"/><text x="390" y="490" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="11.5" fill="#64748b">⑥ replacement ready / surface released</text><path d="M600 546 H1020" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#inkArrow)"/><rect x="690" y="524" width="240" height="19" rx="5" fill="#f5f7fa"/><text x="810" y="538" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="11.5" fill="#334155">⑦ record recovery result or Needs Attention</text>
 <rect x="94" y="560" width="1012" height="30" rx="8" fill="#fff8ed" stroke="#efd8aa"/><text x="112" y="580" font-family="system-ui,Segoe UI,sans-serif" font-size="12" fill="#7c4a0c">One late heartbeat means Suspect only. Recovery is bounded; repeated failure needs attention, while Emergency is reserved for no known viable content.</text>
 <circle cx="95" cy="650" r="5" fill="#334155"/><text x="108" y="654" font-family="system-ui,Segoe UI,sans-serif" font-size="11.5" fill="#64748b">request</text><circle cx="193" cy="650" r="5" fill="#64748b"/><text x="206" y="654" font-family="system-ui,Segoe UI,sans-serif" font-size="11.5" fill="#64748b">response</text><circle cx="303" cy="650" r="5" fill="#b45309"/><text x="316" y="654" font-family="system-ui,Segoe UI,sans-serif" font-size="11.5" fill="#64748b">local control</text><circle cx="438" cy="650" r="5" fill="#087f5b"/><text x="451" y="654" font-family="system-ui,Segoe UI,sans-serif" font-size="11.5" fill="#64748b">verified local content</text>
 </svg>