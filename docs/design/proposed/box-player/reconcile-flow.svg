<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
 <title id="title">Content changes are reconciled by the Supervisor, not by each display</title><desc id="desc">SignalR is only a doorbell. The Supervisor pulls a whole snapshot, verifies local files, then tells one Runtime a revision is ready.</desc>
 <defs><marker id="inkArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#334155"/></marker><marker id="orangeArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#b45309"/></marker><marker id="greenArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#087f5b"/></marker></defs>
 <rect width="1200" height="700" fill="#f5f7fa"/><text x="64" y="59" font-family="system-ui,Segoe UI,sans-serif" font-size="29" font-weight="700" letter-spacing="-.6" fill="#18212f">Content changes are reconciled by the Supervisor, not by each display</text><text x="64" y="90" font-family="system-ui,Segoe UI,sans-serif" font-size="16" fill="#586575">SignalR is only a doorbell. The Supervisor pulls a whole snapshot, verifies local files, then tells one Runtime a revision is ready.</text>
 <rect x="64" y="122" width="1072" height="488" rx="18" fill="#ffffff" stroke="#d4dbe5" stroke-width="1.5"/><text x="94" y="147" font-family="system-ui,Segoe UI,sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.2" fill="#64748b">REQUEST → RESPONSE SEQUENCE</text>
 <line x1="150" y1="216" x2="150" y2="596" stroke="#d5dce5" stroke-width="1" stroke-dasharray="4 6"/><line x1="440" y1="216" x2="440" y2="596" stroke="#d5dce5" stroke-width="1" stroke-dasharray="4 6"/><line x1="760" y1="216" x2="760" y2="596" stroke="#d5dce5" stroke-width="1" stroke-dasharray="4 6"/><line x1="1050" y1="216" x2="1050" y2="596" stroke="#d5dce5" stroke-width="1" stroke-dasharray="4 6"/><rect x="58" y="162" width="184" height="54" rx="11" fill="#ffffff" stroke="#cbd5e1"/><text x="150" y="187" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="700" fill="#273449">Vennusign Cloud</text><text x="150" y="204" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="10.5" fill="#687587">desired state</text><rect x="348" y="162" width="184" height="54" rx="11" fill="#fff8ed" stroke="#cbd5e1"/><text x="440" y="187" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="700" fill="#273449">Player Supervisor</text><text x="440" y="204" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="10.5" fill="#687587">only cloud credential</text><rect x="668" y="162" width="184" height="54" rx="11" fill="#ecf8f2" stroke="#cbd5e1"/><text x="760" y="187" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="700" fill="#273449">Content delivery</text><text x="760" y="204" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="10.5" fill="#687587">revision + assets</text><rect x="958" y="162" width="184" height="54" rx="11" fill="#ffffff" stroke="#cbd5e1"/><text x="1050" y="187" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="700" fill="#273449">Display Runtime</text><text x="1050" y="204" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="10.5" fill="#687587">one assigned output</text><path d="M150 258 H440" fill="none" stroke="#b45309" stroke-width="2.2" marker-end="url(#orangeArrow)"/><rect x="175" y="236" width="240" height="19" rx="5" fill="#f5f7fa"/><text x="295" y="250" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="11.5" fill="#b45309">① SignalR: desired state changed</text><path d="M440 306 H150" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#inkArrow)"/><rect x="175" y="284" width="240" height="19" rx="5" fill="#f5f7fa"/><text x="295" y="298" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="11.5" fill="#334155">② GET versioned desired-state snapshot</text><path d="M150 354 H440" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="5 5" marker-end="url(#inkArrow)"/><rect x="175" y="332" width="240" height="19" rx="5" fill="#f5f7fa"/><text x="295" y="346" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="11.5" fill="#64748b">③ whole Player snapshot (v42)</text><path d="M440 402 H760" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#inkArrow)"/><rect x="480" y="380" width="240" height="19" rx="5" fill="#f5f7fa"/><text x="600" y="394" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="11.5" fill="#334155">④ fetch manifest + required assets</text><path d="M760 450 H440" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="5 5" marker-end="url(#inkArrow)"/><rect x="480" y="428" width="240" height="19" rx="5" fill="#f5f7fa"/><text x="600" y="442" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="11.5" fill="#64748b">⑤ complete files / hashes</text><path d="M440 498 H1050" fill="none" stroke="#b45309" stroke-width="2.2" marker-end="url(#orangeArrow)"/><rect x="625" y="476" width="240" height="19" rx="5" fill="#f5f7fa"/><text x="745" y="490" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="11.5" fill="#b45309">⑥ local: revision ready</text><path d="M1050 546 H440" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="5 5" marker-end="url(#inkArrow)"/><rect x="625" y="524" width="240" height="19" rx="5" fill="#f5f7fa"/><text x="745" y="538" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="11.5" fill="#64748b">⑦ applied revision + render evidence</text>
 <rect x="94" y="560" width="1012" height="30" rx="8" fill="#fff8ed" stroke="#efd8aa"/><text x="112" y="580" font-family="system-ui,Segoe UI,sans-serif" font-size="12" fill="#7c4a0c">A missed or duplicated doorbell is harmless. An incomplete or invalid revision is never promoted; the Runtime stays on its prior complete revision.</text>
 <circle cx="95" cy="650" r="5" fill="#334155"/><text x="108" y="654" font-family="system-ui,Segoe UI,sans-serif" font-size="11.5" fill="#64748b">request</text><circle cx="193" cy="650" r="5" fill="#64748b"/><text x="206" y="654" font-family="system-ui,Segoe UI,sans-serif" font-size="11.5" fill="#64748b">response</text><circle cx="303" cy="650" r="5" fill="#b45309"/><text x="316" y="654" font-family="system-ui,Segoe UI,sans-serif" font-size="11.5" fill="#64748b">local control</text><circle cx="438" cy="650" r="5" fill="#087f5b"/><text x="451" y="654" font-family="system-ui,Segoe UI,sans-serif" font-size="11.5" fill="#64748b">verified local content</text>
 </svg>